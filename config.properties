# Configuration for test execution
# This file can be used to configure test execution parameters

# Browser Settings
browser.type=chromium
browser.headless=false
browser.timeout=30000

# Application URLs
base.url=https://ndosisimplifiedautomation.vercel.app/

# Test Credentials
# WARNING: Never commit actual credentials to version control
# Use environment variables instead
test.user.email=aveetestuser@gmail.com
test.user.password=Testing123456!

# Admin Credentials
admin.email=admin@gmail.com
admin.password=@12345678!

# Timeouts (in milliseconds)
implicit.wait=10000
explicit.wait=15000
page.load.timeout=30000

# Screenshots
screenshot.on.failure=true
screenshot.dir=target/screenshots

# Logging
log.level=INFO

# Parallel Execution
parallel.threads=1

# Report Generation
generate.html.report=true
generate.json.report=true
report.dir=target/cucumber-reports
